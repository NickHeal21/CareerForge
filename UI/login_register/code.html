<body class="bg-background h-full flex items-center justify-center font-body-md text-on-background">
<main class="w-full max-w-md px-container-margin md:px-0">
<div class="bg-surface border border-outline-variant rounded-lg p-lg">
<!-- Header / Logo -->
<div class="flex flex-col items-center mb-xl">
<img alt="CareerForge Logo" class="h-16 w-16 mb-sm object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDU2M8llw8J85wSnkaQ_AjjGgx6HZImAVokoAmAItfdAGHv3zgTEF7fonkd9YDeeD4HSo1QZN2WJXUr913O1JoXq9m-yAzN5c1U9hYbQdpQ6KmfUUGXnrXR6B6bKd5NZZqowA-Y66YNBa6LLObX81HxJ_fK5SGWtTCcufe2mQ-uduBsqF_I_ZtE29UPTcJTfNjErpLh-SulLXFbaiS7kJJ0r71bzG23yUkR_cMAt5LkMEjPcnX0QkVN"/>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">CareerForge</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Sign in to continue your journey</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-md" method="POST">
<!-- Email Input -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="bg-surface-container-low border border-outline-variant rounded-DEFAULT px-md py-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface transition-colors duration-200" id="email" name="email" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="flex flex-col space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot password?</a>
</div>
<input class="bg-surface-container-low border border-outline-variant rounded-DEFAULT px-md py-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface transition-colors duration-200" id="password" name="password" required="" type="password"/>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full bg-primary text-on-primary rounded-lg py-sm px-md font-body-md text-body-md font-semibold hover:bg-surface-tint transition-colors duration-200 flex justify-center items-center" type="submit">
                        Sign In
                    </button>
</div>
</form>
<!-- Register Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Register</a>
</p>
</div>
</div>
</main>
</body></html>
